<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>效果图提示词工作台 · 投标级出图流程工具</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232E6A4C'/%3E%3Cpath d='M8 22 L14 10 L19 16 L24 7' stroke='%23E2ECE5' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='24' cy='7' r='2.4' fill='%23BC6429'/%3E%3C/svg%3E">
<style>
/* ============================================================
   设计 Token：工程图纸风（米灰底 + 松针绿 + 赭橙标记）
   ============================================================ */
:root{
  --bg:#F2F1EC;
  --bg-deep:#E9E7DF;
  --panel:#FBFAF6;
  --panel-2:#F0EEE7;
  --ink:#1F2420;
  --ink-2:#4E554D;
  --ink-3:#82887E;
  --line:#DAD7CC;
  --line-strong:#C2BFB2;
  --green:#2E6A4C;
  --green-deep:#235039;
  --green-soft:#E2ECE5;
  --ochre:#BC6429;
  --ochre-soft:#F5E8DA;
  --blue:#3C6178;
  --blue-soft:#E1E9EF;
  --red:#B23B2E;
  --red-soft:#F4E0DC;
  --shadow:0 1px 2px rgba(31,36,32,.05),0 4px 14px rgba(31,36,32,.05);
  --font-sans:"Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB","Source Han Sans SC",sans-serif;
  --font-mono:"Cascadia Code","JetBrains Mono","Consolas","Sarasa Mono SC",monospace;
  --header-h:56px;
  --side-w:208px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font-sans);
  background:var(--bg);
  color:var(--ink);
  font-size:14px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:14px;color:var(--ink)}
::selection{background:var(--green-soft)}
/* 滚动条 */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3)}
::-webkit-scrollbar-track{background:transparent}

/* ============================================================
   顶栏
   ============================================================ */
.topbar{
  height:var(--header-h);
  background:var(--panel);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:18px;
  padding:0 20px;
  position:sticky;top:0;z-index:50;
}
.brand{display:flex;align-items:center;gap:11px;min-width:var(--side-w)}
.brand-mark{width:34px;height:34px;border-radius:8px;flex:none}
.brand-text{display:flex;flex-direction:column;line-height:1.25}
.brand-text b{font-size:15px;letter-spacing:.3px}
.brand-text span{font-size:11px;color:var(--ink-3);letter-spacing:.6px}
.topbar-spacer{flex:1}
.seg{
  display:inline-flex;background:var(--panel-2);border:1px solid var(--line);
  border-radius:9px;padding:3px;gap:2px;
}
.seg button{
  padding:5px 12px;border-radius:6px;color:var(--ink-2);
  font-size:13px;white-space:nowrap;transition:all .15s;
}
.seg button:hover{color:var(--ink)}
.seg button.active{background:var(--panel);color:var(--green-deep);font-weight:700;box-shadow:var(--shadow)}
.seg.compact button{padding:5px 9px;font-size:12.5px}
.topbar-label{font-size:12px;color:var(--ink-3);margin-right:-10px}

/* ============================================================
   整体布局与侧栏
   ============================================================ */
.app{display:flex;min-height:calc(100vh - var(--header-h))}
.sidebar{
  width:var(--side-w);flex:none;
  background:var(--panel);
  border-right:1px solid var(--line);
  padding:14px 12px;
  position:sticky;top:var(--header-h);
  height:calc(100vh - var(--header-h));
  overflow-y:auto;
}
.nav-item{
  display:flex;align-items:center;gap:11px;
  width:100%;text-align:left;
  padding:9px 11px;border-radius:8px;
  color:var(--ink-2);font-size:13.5px;
  margin-bottom:3px;transition:all .15s;
}
.nav-item svg{width:18px;height:18px;flex:none;stroke:currentColor}
.nav-item:hover{background:var(--panel-2);color:var(--ink)}
.nav-item.active{background:var(--green-soft);color:var(--green-deep);font-weight:700}
.side-note{
  margin-top:16px;padding:11px 12px;border-radius:8px;
  background:var(--panel-2);border:1px solid var(--line);
  font-size:12px;color:var(--ink-3);line-height:1.7;
}
.side-note b{color:var(--ochre);display:block;margin-bottom:2px}
.main{flex:1;min-width:0;padding:24px 28px 40px;width:100%;max-width:1680px;margin:0 auto}
.view{display:none;animation:viewIn .22s ease}
.view.active{display:block}
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ============================================================
   通用组件
   ============================================================ */
.view-head{margin-bottom:20px}
.view-head h1{font-size:21px;font-weight:700;letter-spacing:.3px}
.view-head p{color:var(--ink-2);font-size:13.5px;margin-top:5px;max-width:760px}
.card{
  background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:18px 20px;margin-bottom:16px;
}
.card-title{
  font-size:14px;font-weight:700;margin-bottom:13px;
  display:flex;align-items:center;gap:8px;
}
.card-title .idx{
  width:21px;height:21px;border-radius:6px;background:var(--green);
  color:#fff;font-size:12px;display:inline-flex;align-items:center;justify-content:center;
  font-family:var(--font-mono);flex:none;
}
.card-title .hint{font-weight:400;font-size:12px;color:var(--ink-3);margin-left:4px}
.field{margin-bottom:15px}
.field:last-child{margin-bottom:0}
.field-label{font-size:13px;color:var(--ink-2);font-weight:700;margin-bottom:7px;display:flex;justify-content:space-between;gap:8px}
.field-label .tip{font-weight:400;color:var(--ink-3);font-size:11.5px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  padding:6px 12px;border-radius:7px;
  border:1px solid var(--line-strong);background:var(--panel);
  color:var(--ink-2);font-size:12.5px;transition:all .13s;
  user-select:none;
}
.chip:hover{border-color:var(--green);color:var(--green-deep)}
.chip.on{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}
.chip.ochre.on{background:var(--ochre);border-color:var(--ochre)}
.chip.blue.on{background:var(--blue);border-color:var(--blue)}
select,textarea,.txtinput{
  width:100%;background:var(--panel);border:1px solid var(--line-strong);
  border-radius:8px;padding:8px 11px;outline:none;transition:border-color .15s;
}
select:focus,textarea:focus,.txtinput:focus{border-color:var(--green)}
textarea{resize:vertical;line-height:1.7}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.switch-row{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.switch{width:38px;height:22px;border-radius:12px;background:var(--line-strong);position:relative;transition:background .18s;flex:none}
.switch::after{content:"";position:absolute;top:2.5px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .18s}
.switch.on{background:var(--green)}
.switch.on::after{transform:translateX(16px)}
.switch-row .sw-text{font-size:13px;color:var(--ink-2)}
.switch-row .sw-text b{color:var(--ink)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 18px;border-radius:9px;font-size:13.5px;font-weight:600;
  transition:all .15s;border:1px solid transparent;
}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none}
.btn-primary{background:var(--green);color:#fff}
.btn-primary:hover{background:var(--green-deep)}
.btn-ghost{background:var(--panel);border-color:var(--line-strong);color:var(--ink-2)}
.btn-ghost:hover{border-color:var(--green);color:var(--green-deep)}
.btn-ochre{background:var(--ochre);color:#fff}
.btn-ochre:hover{background:#a55622}
.btn-block{width:100%}
.btn-sm{padding:6px 12px;font-size:12.5px}

/* ============================================================
   工作台双栏
   ============================================================ */
.studio-grid{display:grid;grid-template-columns:minmax(400px,500px) minmax(0,1fr);gap:22px;align-items:start}
.studio-config{min-width:0}
.studio-out{position:sticky;top:calc(var(--header-h) + 18px)}
.out-tabs{display:flex;gap:3px;margin-bottom:0}
.out-tab{
  padding:8px 16px;font-size:13px;color:var(--ink-3);
  border:1px solid var(--line);border-bottom:none;border-radius:9px 9px 0 0;
  background:var(--panel-2);
}
.out-tab.active{background:var(--panel);color:var(--green-deep);font-weight:700}
.out-box{
  background:var(--panel);border:1px solid var(--line);border-radius:0 12px 12px 12px;
  overflow:hidden;
}
.out-actions{display:flex;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--panel-2);flex-wrap:wrap}
.out-content{
  padding:16px 18px;font-family:var(--font-mono);font-size:12.8px;
  line-height:1.85;white-space:pre-wrap;word-break:break-word;
  min-height:340px;max-height:56vh;overflow-y:auto;color:var(--ink);
}
.out-content .seg-h{color:var(--green);font-weight:700;display:block;margin-top:10px}
.out-content .seg-h:first-child{margin-top:0}
.out-content .warn{color:var(--ochre)}
.prompt-meta{font-size:12px;color:var(--ink-3);padding:10px 14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* 工作流选择大卡 */
.flow-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.flow-card{
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:15px 16px;text-align:left;transition:all .16s;position:relative;
  display:flex;flex-direction:column;
}
.flow-card svg{width:26px;height:26px;stroke:var(--green);fill:none;margin-bottom:9px;flex:none}
.flow-card-text{display:block;min-width:0}
.flow-card-text b{display:block;font-size:14px;margin-bottom:4px}
.flow-card-text span{font-size:12px;color:var(--ink-3);line-height:1.6;display:block}
.flow-card:hover{border-color:var(--green);box-shadow:var(--shadow)}
.flow-card.on{border-color:var(--green);background:var(--green-soft)}
.flow-card.on::after{content:"当前";position:absolute;top:11px;right:12px;font-size:11px;color:var(--green);font-weight:700}
@media (min-width:1081px){
  .flow-card{flex-direction:row;align-items:flex-start;gap:13px}
  .flow-card svg{width:30px;height:30px;margin-bottom:0;margin-top:2px}
}

/* 参考图配置 */
.ref-slots{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ref-slot{border:1px dashed var(--line-strong);border-radius:10px;padding:12px;background:var(--panel-2)}
.ref-slot b{font-size:12.5px;display:flex;align-items:center;gap:6px;margin-bottom:6px;color:var(--blue)}
.ref-slot b .num{width:18px;height:18px;border-radius:5px;background:var(--blue);color:#fff;font-size:11px;display:inline-flex;align-items:center;justify-content:center;font-family:var(--font-mono)}
.ref-slot p{font-size:11.5px;color:var(--ink-3);line-height:1.6}
.ref-count{display:flex;gap:6px;align-items:center}

/* 白话命令区 */
.plain-card{background:linear-gradient(180deg,#f8f5ee,#f3f0e8);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:18px}
.plain-head{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:4px}
.plain-sub{font-size:12px;color:var(--ink-3);margin-bottom:10px}
.plain-textarea{width:100%;min-height:76px;border:1px solid var(--line-strong);border-radius:10px;padding:11px 12px;font-size:14px;line-height:1.6;resize:vertical;background:#fff;color:var(--ink)}
.plain-textarea:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(46,106,76,.12)}
.plain-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.plain-examples{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.plain-ex{font-size:12px;background:#fff;border:1px solid var(--line);color:var(--ink-soft);border-radius:20px;padding:5px 12px;cursor:pointer}
.plain-ex:hover{border-color:var(--green);color:var(--green)}
.plain-result{display:grid;grid-template-columns:1.15fr .85fr;gap:14px;margin-top:14px}
.remark-box,.sop-chart-box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
.box-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;font-weight:700;font-size:13.5px}
.conf-badge{font-size:11px;border-radius:20px;padding:2px 9px;font-weight:600}
.conf-high{background:var(--green-soft);color:var(--green)}
.conf-mid{background:#f6ead9;color:var(--ochre)}
.conf-low{background:var(--red-soft);color:var(--red)}
.remark-list{list-style:none;display:flex;flex-direction:column;gap:6px;font-size:13px}
.remark-list li{position:relative;padding-left:14px;line-height:1.5}
.remark-list li:before{content:"";position:absolute;left:0;top:8px;width:5px;height:5px;border-radius:50%;background:var(--green)}
.remark-advice{margin-top:11px;border-top:1px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--ink-soft);line-height:1.5}
.remark-advice b{color:var(--ink)}

/* SOP 纵向流程图 */
.flow-chart{display:flex;flex-direction:column;align-items:stretch}
.fc-node{display:flex;align-items:center;gap:10px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:8px 11px}
.fc-dot{flex:none;width:25px;height:25px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.fc-t{font-size:12.5px;font-weight:600;line-height:1.4}
.fc-link{width:2px;height:15px;background:var(--green);margin-left:23px;position:relative}
.fc-link:after{content:"";position:absolute;bottom:-1px;left:50%;transform:translateX(-50%);border:4px solid transparent;border-top-color:var(--green)}

/* PS 指南与快捷键 */
.ps-guide{display:flex;flex-direction:column;gap:8px}
.ps-step{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12.5px;line-height:1.5}
.ps-keys{display:flex;gap:5px;flex:none;flex-wrap:wrap;justify-content:flex-end}
kbd{font-family:Consolas,'Courier New',monospace;background:#2b302d;color:#eef3ef;border-radius:5px;padding:1px 6px;font-size:11px;white-space:nowrap;line-height:1.5}

/* 遮罩区域 */
.mask-zone{background:var(--red-soft);border:1px solid #e0b8b1;border-radius:10px;padding:13px 14px}
.mask-zone .field-label{color:var(--red)}

/* ============================================================
   专项工具
   ============================================================ */
.tool-hero{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.strategy{border:1px solid var(--line);border-radius:11px;padding:15px 16px;background:var(--panel);position:relative}
.strategy.recommend{border-color:var(--green)}
.strategy .tag{position:absolute;top:13px;right:14px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px}
.strategy.recommend .tag{background:var(--green-soft);color:var(--green-deep)}
.strategy .tag.alt{background:var(--ochre-soft);color:var(--ochre)}
.strategy h3{font-size:14px;margin-bottom:8px;padding-right:70px}
.strategy ol{padding-left:18px;font-size:12.5px;color:var(--ink-2);line-height:1.9}
.strategy .param{margin-top:10px;font-family:var(--font-mono);font-size:11.5px;background:var(--panel-2);border-radius:8px;padding:8px 11px;color:var(--ink-2)}
.strategy .param b{color:var(--ochre)}

/* 视角罗盘 */
.compass-wrap{display:grid;grid-template-columns:240px 1fr;gap:22px;align-items:start}
.compass{width:230px;height:230px;border-radius:50%;border:1.5px solid var(--line-strong);position:relative;margin:0 auto;background:
  radial-gradient(circle at center,var(--panel) 0,var(--panel) 62%,var(--panel-2) 63%,var(--panel-2) 100%)}
.compass .ring-label{position:absolute;font-size:11px;color:var(--ink-3);font-weight:700}
.compass .needle{position:absolute;top:50%;left:50%;transform-origin:0 0;transition:transform .25s}
.compass .center-dot{position:absolute;top:50%;left:50%;width:10px;height:10px;background:var(--ochre);border-radius:50%;transform:translate(-50%,-50%);z-index:3}
.compass .dir-btn{position:absolute;width:30px;height:30px;border-radius:50%;border:1px solid var(--line-strong);background:var(--panel);font-size:11px;color:var(--ink-2);display:flex;align-items:center;justify-content:center;transition:all .13s;z-index:2}
.compass .dir-btn:hover{border-color:var(--green)}
.compass .dir-btn.on{background:var(--green);border-color:var(--green);color:#fff;font-weight:700}
.view-param-row{display:flex;align-items:center;gap:11px;margin-bottom:12px}
.view-param-row label{width:78px;flex:none;font-size:12.5px;color:var(--ink-2);font-weight:700}
input[type=range]{flex:1;accent-color:var(--green)}
.view-param-row .val{font-family:var(--font-mono);font-size:12px;color:var(--green-deep);width:74px;text-align:right;flex:none}
.azimuth-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.batch-out{font-family:var(--font-mono);font-size:12px;white-space:pre-wrap;line-height:1.8;background:var(--panel-2);border-radius:10px;padding:14px 16px;border:1px solid var(--line);max-height:480px;overflow-y:auto}

/* ============================================================
   模板库
   ============================================================ */
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:13px}
.tpl-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px 16px;display:flex;flex-direction:gap;gap:10px;transition:all .15s}
.tpl-card:hover{border-color:var(--green);box-shadow:var(--shadow)}
.tpl-card .tpl-ico{width:34px;height:34px;border-radius:9px;background:var(--green-soft);display:flex;align-items:center;justify-content:center;flex:none}
.tpl-card .tpl-ico svg{width:18px;height:18px;stroke:var(--green);fill:none}
.tpl-card.mine .tpl-ico{background:var(--ochre-soft)}
.tpl-card.mine .tpl-ico svg{stroke:var(--ochre)}
.tpl-card h3{font-size:13.5px;margin-bottom:3px}
.tpl-card p{font-size:11.5px;color:var(--ink-3);line-height:1.6;flex:1}
.tpl-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:2px}
.tpl-tags span{font-size:10.5px;padding:2px 7px;border-radius:5px;background:var(--panel-2);color:var(--ink-2)}
.tpl-actions{display:flex;gap:7px;margin-top:4px}
.tpl-section-title{font-size:13px;font-weight:700;color:var(--ink-2);margin:18px 0 10px;display:flex;align-items:center;gap:8px}
.tpl-section-title::before{content:"";width:4px;height:14px;background:var(--green);border-radius:2px}
.tpl-section-title.mine::before{background:var(--ochre)}

/* ============================================================
   SOP
   ============================================================ */
.sop-tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.sop-tab{padding:8px 16px;border-radius:9px;border:1px solid var(--line-strong);background:var(--panel);font-size:13px;color:var(--ink-2)}
.sop-tab.active{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}
.sop-step{display:flex;gap:15px;margin-bottom:14px}
.sop-step .step-num{width:26px;height:26px;border-radius:8px;background:var(--green-soft);color:var(--green-deep);font-family:var(--font-mono);font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;margin-top:2px}
.sop-step .step-body{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 16px}
.sop-step h3{font-size:13.5px;margin-bottom:6px}
.sop-step ul{padding-left:17px;font-size:12.5px;color:var(--ink-2);line-height:1.9}
.sop-step .key{background:var(--ochre-soft);color:#8a4a1d;border-radius:6px;padding:1px 6px;font-size:11.5px}
.sop-step .key.g{background:var(--green-soft);color:var(--green-deep)}

/* ============================================================
   历史 / 空态 / Toast
   ============================================================ */
.hist-item{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 16px;margin-bottom:10px;display:flex;gap:14px;align-items:flex-start}
.hist-item .hist-time{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-3);width:132px;flex:none;line-height:1.7}
.hist-item .hist-body{flex:1;min-width:0}
.hist-item h3{font-size:13px;margin-bottom:3px}
.hist-item p{font-size:12px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.hist-actions{display:flex;gap:6px;flex:none}
.empty{text-align:center;padding:48px 20px;color:var(--ink-3);border:1px dashed var(--line-strong);border-radius:12px;background:var(--panel)}
.empty svg{width:42px;height:42px;stroke:var(--ink-3);fill:none;margin-bottom:12px}
.empty p{font-size:13px}
#toast{
  position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:#fff;padding:10px 20px;border-radius:9px;
  font-size:13px;opacity:0;pointer-events:none;transition:all .25s;z-index:100;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.badge-count{background:var(--ochre);color:#fff;font-size:10.5px;border-radius:20px;padding:1px 7px;font-family:var(--font-mono)}

/* ============================================================

   ============================================================ */
@media (max-width:1080px){
  .studio-grid{grid-template-columns:1fr}

  .flow-cards{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:860px){

  .side-note{display:none}
  .main{padding:18px 15px 34px}

}

function $(s,root){return (root||document).querySelector(s);}
function $all(s,root){return Array.prototype.slice.call((root||document).querySelectorAll(s));}
function T(item){ return state.lang==='zh' ? item.zh : item.en; }
function findById(arr,id){ return arr.find(function(x){return x.id===id;}); }
function toast(msg){
  const box = $('#toast'); box.textContent = msg; box.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(function(){box.classList.remove('show');},1900);
}
function copyText(text, okMsg){
  function fallback(){
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try{ ok = document.execCommand('copy'); }catch(e){}
    document.body.removeChild(ta);
    if(ok) toast(okMsg||'已复制到剪贴板'); else toast('复制失败，请手动选择文本');
  }
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(function(){toast(okMsg||'已复制到剪贴板');}, fallback);
  }else{ fallback(); }
}

/* ============================================================
   六、提示词组装引擎
   ============================================================ */
function L(zh,en){ return state.lang==='zh' ? zh : en; }

function buildSections(){
  const wf = WORKFLOWS[state.workflow];
  const secs = [];
  const comma = L('，',', ');
  /* 1 任务指令 */
  secs.push({label:L('任务指令','TASK BRIEF'), text:wf.instruction[state.lang]});
  /* 2 参考图使用（工作流前两个角色 + 通用 3-6 角色） */
  const allRefs = wf.refs.concat(EXTRA_REF_ROLES);
  const refs = allRefs.slice(0, state.refCount);
  const refText = refs.map(function(r){
    return L('图','Image ') + r.num + L('：',': ') + T(r);
  }).join('\n');
  secs.push({label:L('参考图使用','REFERENCE IMAGES'), text:refText});
  /* 3 遮罩区域（仅图改图） */
  if(state.workflow==='photo' && state.maskTarget.trim()){
    secs.push({label:L('遮罩区域指令','MASK INSTRUCTION'),
      text:wf.mask[state.lang].replace('{target}', state.maskTarget.trim())});
  }
  /* 4 项目与出图类型 */
  const po = [];
  if(state.project) po.push(T(findById(DATA.projectType,state.project)));
  if(state.output && state.workflow!=='cross') po.push(T(findById(DATA.outputType,state.output)));
  if(po.length) secs.push({label:L('项目与出图类型','SUBJECT & OUTPUT'), text:po.join(comma)});
  /* 4.5 桥型（桥梁 / 高架项目时） */
  if(state.bridgeType && (state.project==='bridge'||state.project==='flyover')){
    secs.push({label:L('桥型结构','BRIDGE TYPE'), text:T(findById(BRIDGE_TYPES,state.bridgeType))});
  }
  /* 4.6 横断面出图模式与要素（仅横断面工作流） */
  if(state.workflow==='cross'){
    if(state.crossMode) secs.push({label:L('出图模式','SECTION MODE'), text:T(findById(CROSS_MODES,state.crossMode))});
    const ce = state.crossElements.map(function(id){return T(findById(CROSS_ELEMENTS,id));});
    if(ce.length) secs.push({label:L('横断面要素','SECTION ELEMENTS'), text:ce.join(comma)});
  }
  /* 5 风格 */
  if(state.style) secs.push({label:L('视觉风格','STYLE'), text:T(findById(DATA.style,state.style))});
  /* 6 时段 / 季相 / 天气光影 */
  const env = [];
  if(state.time) env.push(T(findById(DATA.time,state.time)));
  if(state.season) env.push(T(findById(DATA.season,state.season)));
  if(state.weather) env.push(T(findById(DATA.weather,state.weather)));
  if(env.length) secs.push({label:L('时段与光影','TIME & LIGHT'), text:env.join(comma)});
  /* 7 植物配置 */
  const pl = state.plants.map(function(id){return T(findById(DATA.plants,id));});
  if(pl.length) secs.push({label:L('植物配置','PLANTING'), text:pl.join(comma)});
  /* 8 材质 */
  const ma = state.materials.map(function(id){return T(findById(DATA.materials,id));});
  if(ma.length) secs.push({label:L('主要材质','MATERIALS'), text:ma.join(comma)});
  /* 9 道路标线专项约束（横断面工作流不适用） */
  if(state.lane && state.workflow!=='cross') secs.push({label:L('道路标线约束','ROAD MARKING CONTROL'), text:LANE_CLAUSE[state.lang]});
  /* 10 画面质量 */
  const qu = state.quality.map(function(id){return T(findById(DATA.quality,id));});
  if(qu.length) secs.push({label:L('画面质量','QUALITY'), text:qu.join(comma)});
  /* 11 自定义补充 */
  if(state.custom.trim()) secs.push({label:L('补充要求','EXTRA'), text:state.custom.trim()});
  return secs;
}

function buildNegText(){
  const neg = state.negatives.map(function(id){return T(findById(DATA.negatives,id));});
  if(state.lane && state.laneNeg){
    DATA.laneNeg.forEach(function(n){neg.push(T(n));});
  }
  return neg.join(L('，',', '));
}

    'node':{zh:'节点近景，聚焦局部构造与材质细节，浅景深突出主体',en:'Close-up node, focus on construction and material detail, shallow depth of field'},
    'compare':{zh:'同一机位前后对比构图，视角、焦距与画面范围完全一致',en:'Before/after comparison, identical camera, focal length and framing'}

/* 完整提示词方案：正向 + 视角 + 负向 */
function buildFullPlan(){
  const zh = state.lang==='zh';
  const vr = buildViewRequirement();
  if(zh){
    let out = '【一、正向生成指令】\n'+getCleanText();
    if(vr) out += '\n\n【二、视角与镜头要求】\n'+vr;
    out += '\n\n【三、负向提示词】\n'+buildNegText();
    return out;
  }
  let out = '[1] POSITIVE PROMPT\n'+getCleanText();
  if(vr) out += '\n\n[2] CAMERA & VIEW REQUIREMENT\n'+vr;
  out += '\n\n[3] NEGATIVE PROMPT\n'+buildNegText();
  return out;
}
function currentOutput(){
  if(outTab==='struct') return getStructText();
  if(outTab==='clean') return getCleanText();
  if(outTab==='full') return buildFullPlan();
  return buildNegText();
}

/* ============================================================
   六之补 · 白话命令解析（纯前端关键词规则，无网络依赖）
   ============================================================ */
function matchRule(text, rules){
  for(let i=0;i<rules.length;i++){
    for(let j=0;j<rules[i].kw.length;j++){
      if(text.indexOf(rules[i].kw[j])>=0) return {v:rules[i].v,hit:rules[i].kw[j]};
    }
  }
  return null;
}
function matchMulti(text, rules){
  const out=[];
  rules.forEach(function(r){
    r.kw.forEach(function(k){
      if(text.indexOf(k)>=0 && out.findIndex(function(o){return o.v===r.v;})<0) out.push({v:r.v,hit:k});
    });
  });
  return out;
}
function parsePlainCommand(raw){
  const text = String(raw||'').toLowerCase();
  const res = {hits:[], fields:{}, multi:{plants:[],materials:[]}, lane:false};
  function single(name, rules){
    const m = matchRule(text,rules);
    if(m){ res.fields[name]=m.v; res.hits.push(m.hit); }
  }
  single('workflow',PLAIN_RULES.workflow);
  if(!res.fields.workflow) res.fields.workflow='su';
  single('project',PLAIN_RULES.project);
  single('output',PLAIN_RULES.output);
  single('style',PLAIN_RULES.style);
  single('time',PLAIN_RULES.time);
  single('season',PLAIN_RULES.season);
  single('weather',PLAIN_RULES.weather);
  single('bridgeType',PLAIN_RULES.bridgeType);
  single('crossMode',PLAIN_RULES.crossMode);
  res.multi.plants = matchMulti(text,PLAIN_RULES.plants).map(function(x){return x.v;});
  res.multi.materials = matchMulti(text,PLAIN_RULES.materials).map(function(x){return x.v;});
  res.lane = PLAIN_RULES.laneKw.some(function(k){return text.indexOf(k)>=0;});
  if(res.lane) res.hits.push('标线');
  let n = Object.keys(res.fields).length + res.multi.plants.length + res.multi.materials.length + (res.lane?1:0);
  res.confidence = n>=5?'high':(n>=3?'mid':'low');
  return res;
}
function applyParse(res){
  Object.keys(res.fields).forEach(function(k){ state[k]=res.fields[k]; });
  state.plants = res.multi.plants.slice();
  state.materials = res.multi.materials.slice();
  if(res.lane){ state.lane=true; state.laneNeg=true; }
  if(state.workflow==='cross' && !state.crossMode) state.crossMode='section';
  if(!state.project) state.project='road';
}
function buildRemark(res){
  const zh = state.lang==='zh';
  const summary=[], advice=[];
  if(zh){
    summary.push('工作流：'+WORKFLOWS[res.fields.workflow].name);
    if(res.fields.project) summary.push('项目类型：'+findById(DATA.projectType,res.fields.project).zh);
    if(res.fields.output) summary.push('出图视角：'+findById(DATA.outputType,res.fields.output).zh);
    if(res.fields.style) summary.push('视觉风格：'+findById(DATA.style,res.fields.style).zh);
    if(res.fields.time) summary.push('时段：'+findById(DATA.time,res.fields.time).zh);
    if(res.fields.season) summary.push('季节：'+findById(DATA.season,res.fields.season).zh);
    if(res.fields.weather) summary.push('天气：'+findById(DATA.weather,res.fields.weather).zh);
    if(res.fields.bridgeType) summary.push('桥型：'+findById(BRIDGE_TYPES,res.fields.bridgeType).zh);
    if(res.multi.plants.length) summary.push('植物：'+res.multi.plants.map(function(id){return findById(DATA.plants,id).zh;}).join('、'));
    if(res.multi.materials.length) summary.push('材质：'+res.multi.materials.map(function(id){return findById(DATA.materials,id).zh;}).join('、'));
    if(res.lane) summary.push('已启用道路标线保真');
    if(!res.fields.style) advice.push('未指定风格，默认写实照片级，投标场景最通用');
    if(!res.fields.time) advice.push('未指定光线，推荐上午柔光，光影稳定、便于后期');
    if(!res.fields.season) advice.push('未指定季节，默认夏季（植被最饱满）');
    if(res.lane||res.fields.project==='road'||res.fields.project==='bridge'||res.fields.project==='flyover')
      advice.push('道路/桥梁项目已开启标线约束，避免标线被抽象化，必要时用 PS 分层贴回');
    if(res.fields.workflow==='cross') advice.push('横断面图内不生成文字，尺寸标注与图例另行在 PS/CAD 添加');
    if(res.confidence==='low') advice.push('白话命中信息较少，已按通用默认补全，建议手动核对下方参数');
    return {summary:summary,advice:advice,conf:res.confidence};
  }
  summary.push('Workflow: '+WORKFLOWS[res.fields.workflow].nameEn);
  if(res.fields.project) summary.push('Project: '+findById(DATA.projectType,res.fields.project).en);
  if(res.fields.output) summary.push('View: '+findById(DATA.outputType,res.fields.output).en);
  if(res.fields.style) summary.push('Style: '+findById(DATA.style,res.fields.style).en);
  if(res.fields.time) summary.push('Time: '+findById(DATA.time,res.fields.time).en);
  if(res.multi.plants.length) summary.push('Plants: '+res.multi.plants.map(function(id){return findById(DATA.plants,id).en;}).join(', '));
  if(res.multi.materials.length) summary.push('Materials: '+res.multi.materials.map(function(id){return findById(DATA.materials,id).en;}).join(', '));
  if(res.lane) summary.push('Road marking control enabled');
  if(!res.fields.style) advice.push('No style given, defaulting to photorealistic');
  if(!res.fields.time) advice.push('No time given, recommending soft morning light');
  if(res.confidence==='low') advice.push('Few keywords matched; defaults applied, please review the parameters below');
  return {summary:summary,advice:advice,conf:res.confidence};
}
/* 纵向 SOP 流程图：节点 + 连接箭头 */
function renderFlowChart(workflow){
  const steps = SOP_DATA[workflow].steps;
  return '<div class="flow-chart">'+steps.map(function(s,i){
    const t = s.title.replace(/^第.步 · /,'');
    return '<div class="fc-node"><span class="fc-dot">'+(i+1)+'</span><span class="fc-t">'+t+'</span></div>'+
      (i<steps.length-1?'<div class="fc-link"></div>':'');
  }).join('')+'</div>';
}

function chipGroup(arr, selected, multi, variant){
  return '<div class="chips">' + arr.map(function(item){
    const on = multi ? selected.indexOf(item.id)>=0 : selected===item.id;
    return '<button type="button" class="chip '+(variant||'')+(on?' on':'')+'" data-id="'+item.id+'">'+T(item)+'</button>';
  }).join('') + '</div>';
}

      plainText=v; plainResult=parsePlainCommand(v); applyParse(plainResult);
      renderStudio();
    });
  });
  /* 工作流卡片 */
  $all('.flow-card',root).forEach(function(btn){
    btn.addEventListener('click',function(){ state.workflow = btn.dataset.flow; renderStudio(); });
  });
  /* 参考图数量 */
  $('[data-refcount]',root).addEventListener('click',function(e){
    const b = e.target.closest('button'); if(!b) return;
    state.refCount = parseInt(b.dataset.n,10); renderStudio();
  });
  /* chips 事件委托 */
  $all('.field[data-key]',root).forEach(function(field){
    field.addEventListener('click',function(e){
      const chip = e.target.closest('.chip'); if(!chip) return;
      const key = field.dataset.key, multi = field.dataset.multi==='true', id = chip.dataset.id;
      if(multi){
        const arr = state[key], i = arr.indexOf(id);
        if(i>=0){ arr.splice(i,1); chip.classList.remove('on'); }
        else { arr.push(id); chip.classList.add('on'); }
      }else{
        state[key] = (state[key]===id ? '' : id);
        $all('.chip',field).forEach(function(c){c.classList.remove('on');});
        if(state[key]) chip.classList.add('on');
      }
      refreshOutput();
    });
  });
  /* 开关 */
  $all('.switch',root).forEach(function(sw){
    sw.addEventListener('click',function(){
      const key = sw.dataset.switch;
      state[key] = !state[key];
      sw.classList.toggle('on',state[key]);
      refreshOutput();
    });
  });
  /* 文本域 */
  const mask = $('#maskTarget',root);
  if(mask) mask.addEventListener('input',function(){ state.maskTarget = mask.value; refreshOutput(); });
  $('#customInput',root).addEventListener('input',function(){ state.custom = this.value; refreshOutput(); });
  /* 输出 tab */
  $all('.out-tab',root).forEach(function(tab){
    tab.addEventListener('click',function(){
      outTab = tab.dataset.outtab;
      $all('.out-tab',root).forEach(function(t){t.classList.remove('active');});
      tab.classList.add('active'); refreshOutput();
    });
  });
  /* 复制并记录历史 */
  $('#btnCopy',root).addEventListener('click',function(){
    copyText(currentOutput()); addHistory();
  });
  $('#btnSaveTpl',root).addEventListener('click',saveAsTemplate);
  $('#btnReset',root).addEventListener('click',function(){ resetParams(); renderStudio(); toast(L('参数已重置','Reset done')); });
}

   八、模板保存 / 历史记录 / 模板套用
   ============================================================ */
function saveAsTemplate(){
  const name = window.prompt(L('为模板命名（如：市政道路高角度鸟瞰）','Template name:'));
  if(!name || !name.trim()) return;
  store.myTemplates.unshift({
    id:'tpl_'+Date.now(), name:name.trim(), mine:true,
    state:JSON.parse(JSON.stringify(state)),
    createdAt:new Date().toISOString()
  });
  saveStore(); toast(L('模板已保存','Template saved'));
}
function addHistory(){
  const parts = [];
  if(state.project) parts.push(findById(DATA.projectType,state.project).zh);
  if(state.output) parts.push(findById(DATA.outputType,state.output).zh);
  const summary = parts.join(' · ') || WORKFLOWS[state.workflow].name;
  store.history.unshift({
    id:'h_'+Date.now(), time:new Date().toISOString(),
    workflow:state.workflow, tool:state.tool, summary,
    text:currentOutput(), neg:buildNegText()
  });
  if(store.history.length>60) store.history.length = 60;
  saveStore(); updateHistBadge();
}
function updateHistBadge(){
  const b = $('#histBadge');
  if(store.history.length){ b.style.display='inline-block'; b.textContent = store.history.length; }
  else b.style.display='none';
}

function switchView(name){
  $all('.nav-item').forEach(function(n){ n.classList.toggle('active', n.dataset.view===name); });
  $all('.view').forEach(function(v){ v.classList.remove('active'); });
  $('#view-'+name).classList.add('active');
  if(name==='studio') renderStudio();
  if(name==='tools') renderTools();
  if(name==='templates') renderTemplates();
  if(name==='sop') renderSop();
  if(name==='history') renderHistory();
  window.scrollTo(0,0);
}
$all('.nav-item').forEach(function(n){
  n.addEventListener('click',function(){ switchView(n.dataset.view); });
});
$('#toolSeg').addEventListener('click',function(e){
  const b = e.target.closest('button'); if(!b) return;
  state.tool = b.dataset.tool;
  $all('#toolSeg button').forEach(function(x){x.classList.remove('active');});
  b.classList.add('active');
  if($('#view-studio').classList.contains('active')) renderStudio();
});
$('#langSeg').addEventListener('click',function(e){
  const b = e.target.closest('button'); if(!b) return;
  state.lang = b.dataset.lang;
  $all('#langSeg button').forEach(function(x){x.classList.remove('active');});
  b.classList.add('active');
  const activeNav = $all('.nav-item').find(function(n){return n.classList.contains('active');});
  switchView(activeNav.dataset.view);
});

function compassDirButtons(){

  return DIRS.map(function(d){

    const x = c + r*Math.sin(rad), y = c - r*Math.cos(rad);

      '" style="left:'+(x-15)+'px;top:'+(y-15)+'px">'+d.id+'</button>';
  }).join('') +
  DIRS.map(function(d){
    const rad = d.deg*Math.PI/180, rl = 108;
    const x = c + rl*Math.sin(rad), y = c - rl*Math.cos(rad);
    return '<span class="ring-label" style="left:'+(x-11)+'px;top:'+(y-8)+'px">'+d.zh+'</span>';
  }).join('');
}

/* 参考图锁定与一致性锚点 */
const REF_LOCK_CLAUSE = {
  zh:'以参考图1的设计内容为唯一依据，在不改变任何设计要素、材质、植物与配色的前提下，仅改变相机机位与取景角度重新取景。',
  en:'Use the design in reference image 1 as the single source of truth. Without changing any design element, material, plant or color, reframe the scene only by moving the camera.'
};
const ANCHOR_CLAUSE = {
  zh:'【一致性锚点】本系列各视角图必须保持同一项目设定：相同的建筑与场地体块、材质种类与色彩、植物品种与规格、铺装拼法、光照方向与色温、整体配色与氛围；仅允许相机机位与取景角度变化，不得改变任何设计内容。',
  en:'CONSISTENCY ANCHOR: All views in this series share one project setup — identical masses, material types and colors, plant species and sizes, paving patterns, light direction and color temperature, palette and mood. Only the camera position and framing may change; no design content may vary.'
};
function viewClause(d){
  const v = toolState.tilt, h = toolState.height;
  if(state.lang==='zh'){
    if(v>=85) return '相机位于场地正上方垂直向下俯视，相对高度约 '+h+'m，完整呈现总平面布局；';
    if(v<=22) return '相机位于场地'+d.zh+'侧近地面高度，以约 '+v+'° 轻微俯角朝向场地中心，呈现人视空间感；';
    return '相机位于场地'+d.zh+'侧方位，相对高度约 '+h+'m，以约 '+v+'° 俯角朝向场地中心取景，远近层次清晰；';
  }
  if(v>=85) return 'Camera directly above the site looking straight down at about '+h+' m altitude, showing the full plan layout;';
  if(v<=22) return 'Camera at near-ground level to the '+d.en+' of the site, tilted only '+v+'° toward the center for an eye-level feel;';
  return 'Camera positioned to the '+d.en+' of the site at about '+h+' m altitude, looking toward the center at a '+v+'° tilt-down angle with clear depth;';
}
function buildBatchText(){
  const dirs = DIRS.filter(function(d){return toolState.batchDirs.indexOf(d.id)>=0;});
  if(!dirs.length) return L('请至少选择一个方位','Select at least one direction first.');
  let out = REF_LOCK_CLAUSE[state.lang]+'\n\n'+ANCHOR_CLAUSE[state.lang]+'\n';
  dirs.forEach(function(d,i){
    out += '\n【'+L('视角','View')+' '+(i+1)+' · '+T(d)+'】\n'+viewClause(d);
  });
  return out;
}
function renderNeedles(){
  const layer = $('#needleLayer');
  layer.style.position='absolute'; layer.style.inset='0';
  const c=115, r=80;
  const lines = toolState.batchDirs.map(function(id){
    const d = findById(DIRS,id), rad = d.deg*Math.PI/180;
    const x = c + r*Math.sin(rad), y = c - r*Math.cos(rad);
    return '<line x1="'+c+'" y1="'+c+'" x2="'+x+'" y2="'+y+'" stroke="#BC6429" stroke-width="2" stroke-linecap="round"/>';
  }).join('');
  layer.innerHTML = '<svg viewBox="0 0 230 230" style="width:100%;height:100%">'+lines+'</svg>';
}
function toggleDir(id){
  const i = toolState.batchDirs.indexOf(id);
  if(i>=0) toolState.batchDirs.splice(i,1); else toolState.batchDirs.push(id);
  $all('#compass .dir-btn').forEach(function(b){ b.classList.toggle('on', toolState.batchDirs.indexOf(b.dataset.dir)>=0); });
  $all('#azGrid .chip').forEach(function(b){ b.classList.toggle('on', toolState.batchDirs.indexOf(b.dataset.dir)>=0); });
  renderNeedles(); $('#batchOut').textContent = buildBatchText();
}

  $('#copyLane').addEventListener('click',function(){ copyText(LANE_CLAUSE[state.lang], L('标线约束句已复制','Clause copied')); });

  $('#copyBatch').addEventListener('click',function(){ copyText(buildBatchText(), L('批量提示词已复制','Batch prompt copied')); });
  $('#copyAnchor').addEventListener('click',function(){ copyText(ANCHOR_CLAUSE[state.lang], L('一致性锚点已复制','Anchor copied')); });

function tplCard(tpl, mine){
  const icon = '<svg viewBox="0 0 24 24" stroke-width="1.7"><path d="M4 4h11l5 5v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/><path d="M15 4v5h5"/></svg>';
  return '<div class="tpl-card'+(mine?' mine':'')+'"><div class="tpl-ico">'+icon+'</div>'+
    '<div style="flex:1;min-width:0"><h3>'+tpl.name+'</h3><p>'+tpl.desc+'</p>'+
    '<div class="tpl-tags">'+tpl.tags.map(function(t){return '<span>'+t+'</span>';}).join('')+'</div>'+
    '<div class="tpl-actions"><button class="btn btn-primary btn-sm" data-apply="'+tpl.id+'">'+L('载入并使用','Load')+'</button>'+
    (mine?'<button class="btn btn-ghost btn-sm" data-del="'+tpl.id+'">'+L('删除','Delete')+'</button>':'')+
    '</div></div></div>';
}

    : '<div class="empty"><svg viewBox="0 0 24 24" stroke-width="1.5"><path d="M4 4h11l5 5v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/></svg><p>'+L('还没有自定义模板，在工作台点「存为模板」即可收藏','No custom templates yet. Save one from the studio.')+'</p></div>');
  $('#mountTemplates').innerHTML = html;
  bindTemplates();

function bindTemplates(){
  const root = $('#mountTemplates');
  $all('[data-apply]',root).forEach(function(btn){
    btn.addEventListener('click',function(){
      const tpl = findById(BUILTIN_TEMPLATES,btn.dataset.apply) || findById(store.myTemplates,btn.dataset.apply);
      if(tpl) applyTemplate(tpl);
    });
  });
  $all('[data-del]',root).forEach(function(btn){
    btn.addEventListener('click',function(){
      const i = store.myTemplates.findIndex(function(t){return t.id===btn.dataset.del;});
      if(i>=0){ store.myTemplates.splice(i,1); saveStore(); renderTemplates(); toast(L('模板已删除','Deleted')); }
    });
  });
  $('#exportTpl').addEventListener('click',function(){
    if(!store.myTemplates.length){ toast(L('暂无可导出的模板','Nothing to export')); return; }
    const blob = new Blob([JSON.stringify(store.myTemplates,null,2)],{type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = '我的效果图模板.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(a.href); toast(L('模板已导出','Exported'));
  });
  $('#importTpl').addEventListener('click',function(){ $('#importFile').click(); });
  $('#importFile').addEventListener('change',function(){
    const f = this.files[0]; if(!f) return;
    const reader = new FileReader();
    reader.onload = function(){
      try{
        const arr = JSON.parse(reader.result);
        if(!Array.isArray(arr)) throw new Error('bad');
        let n = 0;
        arr.forEach(function(t){
          if(t && t.name && t.state){
            t.id = 'tpl_'+Date.now()+'_'+n; t.mine = true;
            store.myTemplates.push(t); n++;
          }
        });
        saveStore(); renderTemplates(); toast(L('已导入 '+n+' 个模板',n+' imported'));
      }catch(e){ toast(L('文件格式不正确','Invalid file')); }
    };
    reader.readAsText(f,'UTF-8');
  });
}

/* 兼容内置 build 与自定义 state 的模板套用 */
function applyTemplate(tpl){
  const tool = state.tool, lang = state.lang;
  const snap = tpl.state ? tpl.state : tpl.build();
  state = Object.assign(defaultState(), JSON.parse(JSON.stringify(snap)));
  state.tool = tool; state.lang = lang;
  outTab = 'struct';
  switchView('studio');
  toast(L('已载入模板，可继续调整','Template loaded'));
}

  data.steps.map(function(st){
    return '<div class="sop-step"><div class="step-num">·</div><div class="step-body"><h3>'+st.title+'</h3><ul>'+
      st.items.map(function(i){return '<li>'+i+'</li>';}).join('')+'</ul>'+
      (st.keys.length?'<div class="tpl-actions" style="margin-top:9px">'+st.keys.map(function(k){
        return '<span class="key '+(k.type==='g'?'g':'')+'">'+k.t+'</span>';}).join('')+'</div>':'')+
      '</div></div>';
  }).join('');
  $('#mountSop').innerHTML = html;
  $all('.sop-tab').forEach(function(tab){
    tab.addEventListener('click',function(){ sopTab = tab.dataset.sop; renderSop(); });
  });
}

function fmtTime(iso){
  const d = new Date(iso), p = function(n){return String(n).padStart(2,'0');};
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'\n'+p(d.getHours())+':'+p(d.getMinutes());
}
function renderHistory(){
  let html =
  '<div class="view-head" style="display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap"><div><h1>'+L('历史记录','History')+'</h1>'+
    '<p>'+L('每次复制提示词都会自动留存，最多保留 60 条，数据保存在本机浏览器。','Every copied prompt is saved here (up to 60), stored locally.')+'</p></div>'+
    (store.history.length?'<button class="btn btn-ghost btn-sm" id="clearHist">'+L('清空历史','Clear all')+'</button>':'')+'</div>';
  if(!store.history.length){
    html += '<div class="empty"><svg viewBox="0 0 24 24" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg><p>'+L('暂无历史记录，去工作台生成并复制一条提示词','No history yet. Generate and copy a prompt.')+'</p></div>';
  }else{
    html += store.history.map(function(h){
      return '<div class="hist-item"><div class="hist-time">'+fmtTime(h.time).replace('\n','<br>')+'</div>'+
        '<div class="hist-body"><h3>'+h.summary+'</h3><p>'+WORKFLOWS[h.workflow].name+' · '+h.tool+'</p></div>'+
        '<div class="hist-actions"><button class="btn btn-ghost btn-sm" data-hcopy="'+h.id+'">'+L('复制正文','Copy')+'</button>'+
        '<button class="btn btn-ghost btn-sm" data-hneg="'+h.id+'">'+L('负向','Neg')+'</button>'+
        '<button class="btn btn-ghost btn-sm" data-hdel="'+h.id+'">'+L('删除','Del')+'</button></div></div>';
    }).join('');
  }
  $('#mountHistory').innerHTML = html;
  const clear = $('#clearHist');
  if(clear) clear.addEventListener('click',function(){
    store.history = []; saveStore(); updateHistBadge(); renderHistory();
    toast(L('历史已清空','Cleared'));
  });
  $all('[data-hcopy]').forEach(function(b){
    b.addEventListener('click',function(){
      const h = findById(store.history,b.dataset.hcopy);
      if(h) copyText(h.text,L('已复制','Copied'));
    });
  });
  $all('[data-hneg]').forEach(function(b){
    b.addEventListener('click',function(){
      const h = findById(store.history,b.dataset.hneg);
      if(h) copyText(h.neg||'',L('负向词已复制','Neg copied'));
    });
  });
  $all('[data-hdel]').forEach(function(b){
    b.addEventListener('click',function(){
      const i = store.history.findIndex(function(x){return x.id===b.dataset.hdel;});
      if(i>=0){ store.history.splice(i,1); saveStore(); updateHistBadge(); renderHistory(); }
    });
  });
}


/* 初始化 */
loadStore(); updateHistBadge(); renderStudio();

/* js-anchor */
</script>
